name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A macOS runner bills at 10× a Linux one, so a superseded push must not keep
# building — only the newest commit on a ref matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Single source for the toolchain pin: the SwiftPM cache key has to move with
# it, or a .build restored from the previous Xcode fails to import its own
# modules — a poisoned cache that looks like a source error.
env:
  XCODE_VERSION: '26.3'

# `swift build` catches compile regressions on every PR. It does not exercise
# Scripts/package_app.sh, so packaging runs on pushes to main: cheap per merge, and
# means the packaging path can't first break on a tag push, where the only
# symptom is a broken draft release.
jobs:
  build:
    name: swift build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pinned so a runner-image toolchain bump can't break builds silently.
      # Floor is the macOS 26 SDK: FoundationModelsEngine imports the
      # FoundationModels framework, absent from Xcode 16.x. Bump deliberately.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # ponytail: swiftlint stays unpinned (brew) — a release that adds rules can
      # redden an unrelated PR. Pin the formula if that ever bites twice.
      - name: Lint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint --strict

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.XCODE_VERSION }}-

      - name: Build
        run: swift build

      # The unit tests cover only pure logic (output gates, hotkey matching,
      # spell-check helpers, app policy) and run headless on the runner.
      - name: Test
        run: swift test

      # The release build is the first thing that ever runs package_app.sh, and a
      # broken bundle there only shows up as a bad download. Same script, same
      # runner, one merge earlier. PRs skip it because `swift build` already
      # catches compile failures.
      - name: Package app bundle
        if: github.event_name == 'push'
        run: SIGNING_MODE=adhoc ./Scripts/package_app.sh
